name: Build desktop app

# Builds the unsigned Windows 10/11 .exe and the macOS Apple Silicon and
# Intel .apps -- both mac builds must run *natively* on their own
# architecture (PyInstaller has no cross-compile path), which is what the
# macOS runner labels below give.
#
# NOTE: the paid desktop builds are meant to be built in the private
# roast-telemetry-artifacts repo instead (see notify-desktop.yml here and
# that repo's own desktop-build.yml, which is generated from the same
# template as this file) -- artifacts of a public repo are downloadable by
# any signed-in GitHub user. This copy still works, and is kept in sync so
# the two can't drift, but delete it (and any artifacts it made) before this
# repo goes public.
#
# Every build ships with LICENSE.txt and THIRD-PARTY-NOTICES.txt, generated
# from what's actually in that build (packaging/gen_third_party_notices.py).
#
# Deliberately doesn't call scripts/install.sh / install.ps1 -- those are
# interactive, meant for a first-time human on their own machine, not CI.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  TAG: ${{ github.ref_name }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q

  build-macos:
    name: macOS ${{ matrix.label }}
    needs: backend-tests
    # Two separate builds, not one universal2 binary: a universal2
    # PyInstaller build needs every compiled dependency to ship a universal2
    # wheel (pydantic-core, Pillow, ... mostly don't), so each is built
    # natively on its own architecture instead.
    #   macos-15        -> Apple Silicon (arm64)
    #   macos-15-intel  -> Intel (x86_64). GitHub's LAST Intel runner image,
    #                      available until August 2027 -- macos-13 (the old
    #                      Intel label) was retired in Dec 2025 and a job on
    #                      it just queues forever. After that, Intel needs
    #                      another route (e.g. Rosetta on an Apple Silicon
    #                      runner).
    # fail-fast off: one architecture failing shouldn't cancel the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Silicon, runner: macos-15, arch: arm64 }
          - { label: Intel, runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Set up .venv (mirrors scripts/install.sh, non-interactively)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements.txt
          .venv/bin/pip install -r scripts/tray_requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Build Roast Telemetry.app
        run: packaging/build-macos.sh
      # PyInstaller builds for whatever architecture the runner is, so a
      # wrong runner label would silently ship the wrong build under the
      # right name. Fail instead.
      - name: Check the build really is ${{ matrix.arch }}
        run: |
          got="$(lipo -archs "dist/Roast Telemetry.app/Contents/MacOS/Roast Telemetry")"
          echo "built architecture: $got"
          if [[ "$got" != "${{ matrix.arch }}" ]]; then
            echo "::error::expected ${{ matrix.arch }} but built $got"
            exit 1
          fi
      - name: Add the README, LICENSE and third-party notices
        run: |
          { echo "Roast Telemetry $TAG -- macOS (${{ matrix.label }})"; echo; cat packaging/README-macos-artifact.txt; } > dist/README.txt
          cp LICENSE dist/LICENSE.txt
          .venv/bin/python packaging/gen_third_party_notices.py dist/THIRD-PARTY-NOTICES.txt
      # path is "dist", the .app's *parent* -- upload-artifact treats the
      # directory you give it as the artifact's root, so pointing at the
      # .app itself would flatten its insides. Not pre-zipped either: GitHub
      # wraps artifacts in its own zip, and a zip inside that one won't open
      # in Finder. (Both learned the hard way.)
      - uses: actions/upload-artifact@v4
        with:
          name: RoastTelemetry-macOS-${{ matrix.label }}-${{ env.TAG }}
          path: dist

  build-windows:
    name: Windows 10-11
    needs: backend-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Set up .venv (mirrors scripts/install.ps1, non-interactively)
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip.exe install -r backend\requirements.txt
          .\.venv\Scripts\pip.exe install -r scripts\tray_requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Build Roast Telemetry.exe
        run: packaging\build-windows.ps1
      - name: Add the README, LICENSE and third-party notices
        run: |
          $header = "Roast Telemetry $env:TAG -- Windows 10/11 (64-bit)`r`n`r`n"
          ($header + (Get-Content packaging\README-windows-artifact.txt -Raw)) | Set-Content dist\README.txt
          Copy-Item LICENSE dist\LICENSE.txt
          .\.venv\Scripts\python.exe packaging\gen_third_party_notices.py dist\THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RoastTelemetry-Windows-10-11-${{ env.TAG }}
          path: dist
