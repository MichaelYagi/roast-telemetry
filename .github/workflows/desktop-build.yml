name: Build desktop app

# Builds the unsigned Windows .exe and macOS .app via
# packaging/build-windows.ps1 / packaging/build-macos.sh -- both must run
# *natively* on their target OS (PyInstaller has no cross-compile path),
# which is exactly what macos-latest/windows-latest runners give.
#
# Same trigger as release.yml -- every vX.Y.Z tag, no filtering by
# version component. (While this pipeline is still being proven out on
# real GitHub-hosted runners -- it's only ever been verified headless on
# WSL2 before, and has already broken twice on a first *real* native
# build, see git history: "could not open serial port 'socket://...'",
# "No module named 'pystray'" -- testing tags are just plain patch bumps
# by convention, not because this workflow itself treats patch tags
# specially.)
#
# Deliberately doesn't call scripts/install.sh / install.ps1 -- those are
# interactive (prompt before touching system state via brew/apt/winget),
# meant for a first-time human on their own machine, not CI. This runs
# the handful of non-interactive equivalent steps directly instead.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Set up .venv (mirrors scripts/install.sh, non-interactively)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements.txt
          .venv/bin/pip install -r scripts/tray_requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Build Roast Telemetry.app
        run: packaging/build-macos.sh
      - name: Add a README explaining the Gatekeeper warning
        run: cp packaging/README-macos-artifact.txt "dist/README.txt"
      # Not pre-zipped -- v4 already preserves directory structure/
      # permissions/symlinks on its own, and GitHub's artifact download
      # always wraps whatever's uploaded in its own container zip
      # regardless. Pre-zipping on top of that produced a zip-inside-a-
      # zip that macOS's own Archive Utility (Finder double-click)
      # refused to open at all ("unsupported format") -- confirmed live
      # on the v1.2.1 build.
      #
      # path points at "dist", the .app's *parent*, not the .app itself
      # -- upload-artifact treats whatever directory you give it as the
      # artifact's own root, so pointing straight at the .app uploaded
      # its insides (Contents/, Info.plist, ...) flattened at the top
      # level, losing "Roast Telemetry.app" as a folder name entirely.
      # Confirmed live on v1.2.2. build-macos.sh already removes
      # everything from dist/ except the finished .app, so this is safe.
      - uses: actions/upload-artifact@v4
        with:
          name: RoastTelemetry-macOS-${{ github.ref_name }}
          path: dist

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Set up .venv (mirrors scripts/install.ps1, non-interactively)
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip.exe install -r backend\requirements.txt
          .\.venv\Scripts\pip.exe install -r scripts\tray_requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Build Roast Telemetry.exe
        run: packaging\build-windows.ps1
      - name: Add a README explaining the SmartScreen warning
        run: Copy-Item packaging\README-windows-artifact.txt "dist\README.txt"
      # path is the whole dist folder, not just the .exe, so README.txt
      # rides along in the same artifact -- see the macOS job's own
      # comment on why upload-artifact's path must be the *parent* of
      # what you want preserved as a named entry, not a single loose
      # file (that part doesn't apply here, .exe is already a single
      # file either way, but dist as a whole is what carries both).
      - uses: actions/upload-artifact@v4
        with:
          name: RoastTelemetry-Windows-${{ github.ref_name }}
          path: dist
