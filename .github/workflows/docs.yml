name: Deploy docs to GitHub Pages

# Publishes docs/ (plain static HTML, no build step) to
# https://michaelyagi.github.io/roast-telemetry -- separate from ci.yml
# (backend tests + frontend build) and release.yml (tagged release
# packaging), since this has nothing to do with either: it runs on every
# push to main that touches docs/, or can be triggered manually.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time -- a newer push should win over an
# in-flight older one, not queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
